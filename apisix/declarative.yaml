plugin_metadata:
  opentelemetry:
    resource:
      service.name: apisix-gateway
    collector:
      address: jaeger:4318
      request_timeout: 3
    set_ngx_var: false


global_rules:
  openid-connect:
    client_id: ${KEYCLOAK_CLIENT_ID}
    client_secret: ${KEYCLOAK_CLIENT_SECRET}
    discovery: ${KEYCLOAK_DISCOVERY_URL}
    realm: ticketing
    bearer_only: true
    use_jwks: true
    token_signing_alg_values_expected: RS256
    claim_validator:
      issuer:
        valid_issuers:
          - http://localhost:8080/realms/ticketing
    ssl_verify: false
    unauth_action: deny
    set_access_token_header: false
    set_id_token_header: false
    set_userinfo_header: true
  serverless-pre-function:
    phase: before_proxy
    functions:
      - 'return function(conf, ctx) local userinfo = ngx.var.http_x_userinfo; if not userinfo then return ngx.exit(401) end; local decoded = ngx.decode_base64(userinfo); if not decoded then return ngx.exit(401) end; local cjson = require("cjson.safe"); local claims = cjson.decode(decoded); if not claims or type(claims.sub) ~= "string" or claims.sub == "" then return ngx.exit(401) end; ngx.req.set_header("X-User-ID", claims.sub); ngx.req.clear_header("X-Userinfo") end'
  opentelemetry:
    sampler:
      name: always_on

services:
  - name: order-service
    description: Order service gRPC proxy
    upstream:
      name: order-upstream
      scheme: grpc
      type: roundrobin
      discovery_type: consul
      service_name: order
    routes:
      - name: order-place-order
        uris:
          - /orders
        methods:
          - POST
        plugins:
          grpc-transcode:
            _state: enabled
            proto_id: combined
            service: order.OrderService
            method: PlaceOrder

  - name: listing-service
    description: Listing service JSON-to-gRPC proxy through Envoy
    upstream:
      name: listing-transcoder-upstream
      scheme: http
      type: roundrobin
      nodes:
        - host: grpc-json-transcoder
          port: 8080
          weight: 1
    routes:
      - name: listing-json-api
        uris:
          - /listings/*
        methods:
          - GET
          - POST
