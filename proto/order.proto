syntax = "proto3";

package order;

import "google/api/annotations.proto";

service OrderService {
  rpc PlaceOrder (PlaceOrderRequest) returns (PlaceOrderResponse) {
    option (google.api.http) = {
      post: "/orders"
      body: "*"
    };
  }
}

message PlaceOrderRequest {
  int32 order_id = 1;
}

message PlaceOrderResponse {
  int32 orderId = 1;
  string status = 2;
}
